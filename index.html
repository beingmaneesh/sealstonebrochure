<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sealstone Waterproofing Solutions Brochure</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #f2f4f7;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        background: #ffffff;
        border-bottom: 1px solid #dfe3e8;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        color: #15233c;
      }

      .download {
        flex-shrink: 0;
        padding: 10px 14px;
        border-radius: 6px;
        color: #ffffff;
        background: #0b4a75;
        text-decoration: none;
        font-weight: bold;
      }

      .download:hover {
        background: #083955;
      }

      main {
        height: calc(100vh - 61px);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 600px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          height: calc(100vh - 116px);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sealstone Waterproofing Solutions</h1>
      <a class="download" href="sealstone_waterproofing_solutions.pdf" download>
        Download Brochure
      </a>
    </header>

    <main>
      <iframe
        src="sealstone_waterproofing_solutions.pdf"
        title="Sealstone Waterproofing Solutions brochure"
      >
      </iframe>
    </main>
  </body>
</html>
